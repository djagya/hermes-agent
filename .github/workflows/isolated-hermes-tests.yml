name: Isolated Hermes Tests
run-name: isolated-${{ inputs.request_id }}-${{ inputs.mode }}-${{ inputs.target }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Correlation ID emitted by scripts/hermes-test
        required: true
        type: string
      mode:
        description: Narrow target or full sliced suite
        required: true
        default: narrow
        type: choice
        options:
          - narrow
          - full
      target:
        description: Exact tests/...py or node ID; ignored in full mode
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: isolated-tests-${{ github.ref }}-${{ inputs.request_id }}
  cancel-in-progress: false

env:
  HERMES_HOME: /tmp/hermes-home
  HERMES_DISABLE_LAZY_INSTALLS: '1'
  OPENROUTER_API_KEY: ''
  OPENAI_API_KEY: ''
  NOUS_API_KEY: ''

jobs:
  narrow:
    if: inputs.mode == 'narrow'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/astral-sh/uv:0.9.28-python3.11-bookworm-slim
      options: --cpus 2 --memory 5g --pids-limit 512
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system dependencies
        run: |
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends git build-essential curl ripgrep
          rm -rf /var/lib/apt/lists/*

      - name: Prove production isolation
        run: |
          set -eu
          test ! -e /run/service/gateway-default
          test ! -e /opt/data/gateway_state.json
          test ! -S /var/run/docker.sock
          test "$(cat /proc/1/comm)" != "s6-svscan"

      - name: Validate target
        env:
          TEST_TARGET: ${{ inputs.target }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          target = os.environ['TEST_TARGET']
          pattern = r"tests/[A-Za-z0-9_./-]+\.py(?:::[A-Za-z0-9_.\[\]-]+)*"
          if not re.fullmatch(pattern, target) or '..' in target:
              raise SystemExit(f"invalid narrow target: {target!r}")
          file_part = target.split('::', 1)[0]
          if not Path(file_part).is_file():
              raise SystemExit(f"target file does not exist: {file_part}")
          print(f"validated target: {target}")
          PY

      - name: Install locked dependencies
        run: >-
          uv sync --locked --python 3.11
          --extra all --extra dev --extra anthropic --extra mistral
          --extra fal --extra modal --extra daytona --extra hindsight
          --extra parallel-web

      - name: Run narrow target
        env:
          TEST_TARGET: ${{ inputs.target }}
        run: uv run --no-sync python -m pytest "$TEST_TARGET" -q --tb=short

  full:
    if: inputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        slice: ['1/8', '2/8', '3/8', '4/8', '5/8', '6/8', '7/8', '8/8']
    container:
      image: ghcr.io/astral-sh/uv:0.9.28-python3.11-bookworm-slim
      options: --cpus 2 --memory 5g --pids-limit 768
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system dependencies
        run: |
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends git build-essential curl ripgrep
          rm -rf /var/lib/apt/lists/*

      - name: Prove production isolation
        run: |
          set -eu
          test ! -e /run/service/gateway-default
          test ! -e /opt/data/gateway_state.json
          test ! -S /var/run/docker.sock
          test "$(cat /proc/1/comm)" != "s6-svscan"

      - name: Install locked dependencies
        run: >-
          uv sync --locked --python 3.11
          --extra all --extra dev --extra anthropic --extra mistral
          --extra fal --extra modal --extra daytona --extra hindsight
          --extra parallel-web

      - name: Run isolated suite slice
        env:
          HERMES_TEST_WORKERS: '2'
        run: scripts/run_tests.sh --slice "${{ matrix.slice }}"
