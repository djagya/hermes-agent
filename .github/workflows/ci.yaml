name: CI

# Orchestrator workflow. Runs ``detect-changes`` once, then conditionally
# calls the sub-workflows that a PR can actually affect. A final
# ``all-checks-pass`` gate job aggregates results so branch protection only
# needs to require a single check.
#
# Sub-workflows are triggered via ``workflow_call`` and keep their own job
# definitions, matrices, and concurrency settings. They no longer have
# ``push:`` / ``pull_request:`` triggers of their own — everything flows
# through this file.
#
# FORK MINUTE POLICY (djagya/hermes-agent): ordinary PRs and pushes to main
# run SELECTIVE CI — the classifier (scripts/ci/classify_changes.py) maps the
# changed files to affected lanes, pytest subtrees, npm workspaces, and OS
# lanes, and everything else is skipped. Selective mode is fail-closed to
# broad: an unrecognized change runs the FULL suite, never nothing.
#
# BEFORE OPENING AN UPSTREAM (NousResearch) PR, run the full matrix manually:
#
#     gh workflow run ci.yaml --ref <branch>            # or: Actions → CI →
#                                                       # Run workflow → branch
#
# A workflow_dispatch run always executes every lane, all 8 test slices, and
# both OS lanes, and prints a "Change classification" summary (mode: full) on
# the detect job's run page. Link that run in the upstream PR body as the
# full-validation receipt. Push-to-main runs are selective post-merge
# verification; the dispatch run is the pre-upstream gate.
#
# SECURITY: this workflow runs PR-controlled actions, workflows, and code.
# Do not add ``secrets: inherit`` or GitHub App credentials here. Trusted
# main-only automation uses protected environments in its own workflows.

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Stable-release candidate run: force every applicability lane and make the aggregate gate strict (skipped required lanes fail).'
        required: false
        type: boolean
        default: false
      strict_acceptance:
        description: "Acceptance runs only: known_failure owners whose gaps FAIL this run instead of xfailing ('upd-txn', a comma list, or '1' for every gap). Sets HERMES_E2E_STRICT_ACCEPTANCE for the E2E suites (tests/e2e/core/_pending_fixes.py)."
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      commit:
        description: Commit to test and build. Empty keeps the triggering commit.
        type: string
        default: ''
      release:
        description: 'Stable-release candidate run: force every applicability lane and make the aggregate gate strict (skipped required lanes fail).'
        required: false
        type: boolean
        default: false
  pull_request:
    # dlz: the defaults plus ready_for_review. Draft PRs skip every lane (see
    # detect/all-checks-pass); marking the PR ready fans out the full run.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # needed by lint (PR comment) + supply-chain review_status

# cancel-in-progress applies to PR events and to manual dispatches on a non-main
# branch: a re-dispatch on the same fix/debug branch replaces the stale run
# instead of queuing behind it (dispatches share the ref's group, and a queued
# run waited out the old run's slow upgrade/Windows legs). A push to main, a
# dispatch on main and above all a stable-release workflow_call run are never
# cancelled — the caller's own concurrency uses github.run_id, so even a parent
# rerun cannot kill this child mid-flight.
# Release (workflow_call with inputs.release) never cancels and never gets
# cancelled: its group is github.run_id. PRs collapse per-PR; pushes use the
# ref as before.
concurrency:
  group: ci-${{ inputs.release == true && github.run_id || (github.event_name == 'pull_request' && github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ inputs.release != true && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main')) }}

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # detect: run the classifier once. Every downstream job reads its outputs
  # to decide whether to run — and, for the Python/JS/OS lanes, HOW MUCH to
  # run (py_scope/py_roots, frontend_workspaces, os_tests).
  #
  # Fail-open matrix:
  #   pull_request     — classify the pinned base...head diff.
  #   push (main)      — selective post-merge verification: classify the
  #                      pushed before...sha diff; any comparison failure
  #                      fails open to full.
  #   workflow_dispatch — ALWAYS full: the manual pre-upstream-PR gate.
  #   classifier failure/empty diff/.github change — full, every lane.
  # ─────────────────────────────────────────────────────────────────────
  detect:
    name: Detect affected areas
    # dlz: no runners for draft PRs (the account shares a 40-job concurrency
    # cap). Every lane needs detect, so they all skip with it; non-draft PRs,
    # push, dispatch and workflow_call (no pull_request payload) are unchanged.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      python: ${{ steps.gate-lanes.outputs.python }}
      python_prod: ${{ steps.gate-lanes.outputs.python_prod }}
      frontend: ${{ steps.gate-lanes.outputs.frontend }}
      site: ${{ steps.gate-lanes.outputs.site }}
      scan: ${{ steps.gate-lanes.outputs.scan }}
      deps: ${{ steps.gate-lanes.outputs.deps }}
      uv_lock: ${{ steps.gate-lanes.outputs.uv_lock }}
      npm_lock: ${{ steps.gate-lanes.outputs.npm_lock }}
      bootstrap: ${{ steps.gate-lanes.outputs.bootstrap }}
      desktop_updater: ${{ steps.gate-lanes.outputs.desktop_updater }}
      rust: ${{ steps.gate-lanes.outputs.rust }}
      remote_backends: ${{ steps.gate-lanes.outputs.remote_backends }}
      catalog: ${{ steps.gate-lanes.outputs.catalog }}
      docker_meta: ${{ steps.gate-lanes.outputs.docker_meta }}
      py_scope: ${{ steps.classify.outputs.py_scope }}
      py_roots: ${{ steps.classify.outputs.py_roots }}
      frontend_workspaces: ${{ steps.classify.outputs.frontend_workspaces }}
      os_tests: ${{ steps.gate-lanes.outputs.os_tests }}
      desktop_e2e: ${{ steps.gate-lanes.outputs.desktop_e2e }}
      mode: ${{ steps.classify.outputs.mode }}
      e2e: ${{ steps.gate-lanes.outputs.e2e }}
      e2e_upgrade: ${{ steps.gate-lanes.outputs.e2e_upgrade }}
      e2e_desktop_core: ${{ steps.gate-lanes.outputs.e2e_desktop_core }}
      e2e_desktop_update: ${{ steps.gate-lanes.outputs.e2e_desktop_update }}
      event_name: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          sparse-checkout: |
            .github/actions/detect-changes
            scripts/ci/classify_changes.py
          sparse-checkout-cone-mode: false
      - name: Detect affected areas
        id: classify
        uses: ./.github/actions/detect-changes
        with:
          github-token: ${{ github.token }}
      - name: Force all lanes on release; E2E only on release or dispatch
        # Overwrite the classifier outputs with 'true' when inputs.release. The E2E
        # lanes are forced off unless this is a release run or a manual dispatch
        # (whose empty diff already turns every lane on): never on a pull request
        # or a push to main, whatever the diff or labels say.
        id: gate-lanes
        env:
          RELEASE: ${{ inputs.release }}
          EVENT_NAME: ${{ github.event_name }}
          CLASSIFIED: ${{ toJSON(steps.classify.outputs) }}
          # djagya/hermes-agent ships one linux/amd64 Docker image. macOS/Windows
          # tests, desktop E2E, Rust, the bootstrap installer and the docs site
          # cannot affect it, and on the fork they were most of every upgrade's
          # CI time. `hermes update` (e2e_upgrade) is refused on image installs, so its
          # N-1 -> HEAD suites cannot affect the image either. Lean applies to push/PR only: a manual `workflow_dispatch` stays the
          # full-validation receipt the header above describes (release=true forces every lane).
          FORK_LEAN: ${{ github.repository == 'djagya/hermes-agent' && github.event_name != 'workflow_dispatch' && inputs.release != true }}
        run: |
          python3 - <<'PY'
          import json, os
          values = json.loads(os.environ['CLASSIFIED'])
          release = os.environ['RELEASE'] == 'true'
          e2e_allowed = release or os.environ['EVENT_NAME'] == 'workflow_dispatch'
          values['desktop_e2e'] = 'true'
          if os.environ['FORK_LEAN'] == 'true':
              for lane in ('os_tests', 'rust', 'bootstrap', 'site', 'desktop_updater', 'desktop_e2e',
                           'e2e_upgrade', 'e2e_desktop_core', 'e2e_desktop_update'):
                  values[lane] = 'false'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              for lane, value in values.items():
                  if lane.startswith('e2e') and not e2e_allowed:
                      value = 'false'
                  elif release and value in ('true', 'false'):
                      value = 'true'
                  if '\n' in value or '\r' in value:
                      continue
                  output.write(f'{lane}={value}\n')
          PY

  # ─────────────────────────────────────────────────────────────────────
  # Lane-gated sub-workflows. Each runs in parallel after detect finishes.
  # Skipped workflows (if condition is false) don't spin up runners.
  #
  # The E2E suites (e2e, e2e-upgrade, both Desktop suites, and the two
  # Windows journeys in tests-os) run ONLY on a release run (inputs.release)
  # or a manual dispatch; the detect gate forces their lanes off for pull
  # requests and pushes to main.
  # ─────────────────────────────────────────────────────────────────────
  tests:
    name: Python tests
    needs: detect
    # Its E2E jobs are lanes of their own: a lane the classifier sets must reach
    # its job whatever `python` says (tests/ci/test_update_ci_routing.py).
    if: needs.detect.outputs.python == 'true' || needs.detect.outputs.e2e == 'true' || needs.detect.outputs.e2e_upgrade == 'true'
    uses: ./.github/workflows/tests.yml
    with:
      scope: ${{ needs.detect.outputs.py_scope }}
      roots: ${{ needs.detect.outputs.py_roots }}
      commit: ${{ inputs.commit }}
      e2e: ${{ needs.detect.outputs.e2e == 'true' }}
      e2e_upgrade: ${{ needs.detect.outputs.e2e_upgrade == 'true' }}
      strict_acceptance: ${{ inputs.strict_acceptance || '' }}

  # macOS + Windows lanes. The main `tests` lane above is Linux-only, and
  # the OS-marked tests it collects are skipped there by design (see the
  # `_OS_MARKS` comment in tests/conftest.py) — this is where they run.
  # Gated on the os_tests lane: armed by the platform surfaces those suites
  # actually exercise (tools/, hermes_cli/, scripts/, apps/, installer and
  # desktop-updater files, manifests, conftest) and by fail-open/full mode.
  # An agent/gateway/cron-only change pays no 10x macOS minutes on ordinary
  # PRs; full dispatch and fail-open always run both lanes.
  # Within that, upstream also arms it for desktop_updater (TypeScript-only
  # Electron marker / result readers) and the e2e/e2e_upgrade journeys.
  tests-os:
    name: OS-specific tests
    needs: detect
    if: (github.repository == 'NousResearch/hermes-agent' || needs.detect.outputs.os_tests == 'true') && (needs.detect.outputs.python == 'true' || needs.detect.outputs.desktop_updater == 'true' || needs.detect.outputs.e2e == 'true' || needs.detect.outputs.e2e_upgrade == 'true')
    uses: ./.github/workflows/tests-os.yml
    with:
      commit: ${{ inputs.commit }}
      # The Windows lane spawns the real desktop-update hand-off script
      # (tests/test_desktop_update_windows_*.py) only when that surface
      # changed; unit-level platforms("windows") tests always run.
      desktop_updater: ${{ needs.detect.outputs.desktop_updater == 'true' }}
      e2e: ${{ needs.detect.outputs.e2e == 'true' }}
      e2e_upgrade: ${{ needs.detect.outputs.e2e_upgrade == 'true' }}
      strict_acceptance: ${{ inputs.strict_acceptance || '' }}

  lint:
    name: Python lints
    needs: detect
    # frontend too: the code-health ratchet in lint.yml also covers TypeScript.
    if: needs.detect.outputs.python == 'true' || needs.detect.outputs.frontend == 'true'
    uses: ./.github/workflows/lint.yml
    with:
      commit: ${{ inputs.commit }}
      event_name: ${{ needs.detect.outputs.event_name }}
      python: ${{ needs.detect.outputs.python == 'true' }}

  js-tests:
    name: JS & TS checks
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    uses: ./.github/workflows/js-tests.yml
    with:
      workspaces: ${{ needs.detect.outputs.frontend_workspaces }}
      commit: ${{ inputs.commit }}

  rust-tests:
    name: Rust tests
    needs: detect
    # Only for PRs that touch a Rust crate. `.rs` is under apps/, so these
    # changes used to run the TypeScript matrix and nothing that compiles them.
    if: needs.detect.outputs.rust == 'true'
    uses: ./.github/workflows/rust-tests.yml
    with:
      commit: ${{ inputs.commit }}

  catalog-tests:
    name: Catalog tests
    needs: detect
    # A PR that changes only catalog entry data runs these instead of the
    # Python suite (the classifier turns `python` off for it); required whenever
    # detect selects it.
    if: needs.detect.outputs.catalog == 'true'
    uses: ./.github/workflows/catalog-tests.yml
    with:
      commit: ${{ inputs.commit }}

  remote-backends:
    name: Remote terminal backends
    needs: detect
    # The SSH and Docker terminal backends against a real sshd container and the
    # runner's Docker daemon. Only PRs that touch the backends / terminal tool /
    # their real tests start it (and every push to main); it runs in parallel with
    # the other lanes and is required whenever detect selects it.
    if: needs.detect.outputs.remote_backends == 'true'
    uses: ./.github/workflows/remote-backends.yml
    with:
      commit: ${{ inputs.commit }}

  bootstrap-installer:
    name: Bootstrap installer
    needs: detect
    # The bootstrap-installer path: install.sh, the pin fragments it embeds,
    # and the version stamp it ships. The PowerShell installer's native tests
    # are platforms("windows") pytest files and run in tests-os.
    if: needs.detect.outputs.bootstrap == 'true'
    uses: ./.github/workflows/bootstrap-installer.yml
    with:
      commit: ${{ inputs.commit }}

  e2e-desktop:
    name: Desktop E2E
    needs: detect
    # python_prod (not python): the Playwright suite exercises the built app
    # + `hermes serve` backend, which never import anything under tests/.
    # Tests-only PRs (~17% of commits) skip this 5-minute job — the longest
    # single job in the workflow — while still running the full pytest lanes.
    #
    # Re-disabled (Sep 2026): the Sep 1 re-enable is still incredibly flaky.
    # Disabled until this suite is stable. Use a non-matching event rather
    # than a literal false (actionlint rejects constant job conditions).
    # To re-enable, restore:
    #   if: ${{ needs.detect.outputs.python_prod == 'true' || needs.detect.outputs.frontend == 'true' }}
    if: github.event_name == 'desktop-e2e-disabled'
    uses: ./.github/workflows/e2e-desktop.yml
    with:
      commit: ${{ inputs.commit }}

  e2e-desktop-core:
    name: Desktop core E2E
    needs: detect
    # The deterministic core suite (apps/desktop/e2e/core): transcript
    # integrity, boot/respawn/orphans, clarify+approval. Required; retries 0.
    if: needs.detect.outputs.desktop_e2e == 'true' && needs.detect.outputs.e2e_desktop_core == 'true'
    uses: ./.github/workflows/e2e-desktop-core.yml
    with:
      commit: ${{ inputs.commit }}

  e2e-desktop-update:
    name: Desktop update E2E
    needs: detect
    # apps/desktop/e2e/update: a real install.sh install + packaged Desktop,
    # first run, "Update now" hand-off/relaunch, concurrent-update refusal.
    # Required when it runs: a PR that touches the Desktop update path (the
    # classifier's e2e_desktop_update lane) cannot merge on a red shard. Like
    # the Linux e2e-upgrade shards and the Windows install + update journey
    # (tests / tests-os, gated on e2e_upgrade), it is skipped — and the skip
    # counts as success — when the PR does not touch that path.
    # dlz: also gated on desktop_e2e (off under FORK_LEAN on push/PR).
    if: needs.detect.outputs.desktop_e2e == 'true' && needs.detect.outputs.e2e_desktop_update == 'true'
    uses: ./.github/workflows/e2e-desktop-update.yml
    with:
      commit: ${{ inputs.commit }}

  docs-site:
    name: Docs Site
    needs: detect
    if: needs.detect.outputs.site == 'true'
    uses: ./.github/workflows/docs-site-checks.yml
    with:
      commit: ${{ inputs.commit }}

  # Every cheap repository guard (infographics, profile archives, case collisions, large blobs,
  # lazy_deps imports, stale icons, unrelated histories, contributor attribution, uv.lock,
  # prompt-surface and JS lockfile diffs, supply-chain scan, Docker lint) as steps of ONE job.
  # Each used to be its own job on the same runner: a full billed minute for 0-13s of work.
  # Each step keeps its own lane gate, so the detect outputs it needs are passed down.
  repo-guards:
    name: Repository guards
    needs: detect
    uses: ./.github/workflows/repo-guards.yml
    with:
      commit: ${{ inputs.commit }}
      event_name: ${{ needs.detect.outputs.event_name }}
      python: ${{ needs.detect.outputs.python == 'true' }}
      catalog: ${{ needs.detect.outputs.catalog == 'true' }}
      scan: ${{ needs.detect.outputs.scan == 'true' }}
      deps: ${{ needs.detect.outputs.deps == 'true' }}
      npm_lock: ${{ needs.detect.outputs.npm_lock == 'true' }}
      uv_lock: ${{ needs.detect.outputs.uv_lock == 'true' }}
      docker_meta: ${{ needs.detect.outputs.docker_meta == 'true' }}

  # ─────────────────────────────────────────────────────────────────────
  # Gate: runs after everything. ``if: always()`` ensures it reports a
  # status even when some deps were skipped. Only actual ``failure`` /
  # ``cancelled`` results cause it to fail; intentional ``skipped`` results
  # (lanes the classifier turned off) are treated as neutral.
  #
  #   Non-release (PR/push): failure fails. Update/E2E consumers selected
  #   by detect.outputs must succeed; only unselected consumers may skip.
  #   Release (inputs.release): strict — every required job must be
  #   `success`. A skipped required lane fails the gate; only the deferred
  #   Desktop E2E (e2e-desktop) may skip. The PR-only guards are steps of
  #   repo-guards, which itself runs on every event. The OSV scan's
  #   findings are advisory, but its execution is required.
  #
  # Zero-job escape guard: a lane the classifier SELECTED must produce a
  # real job result — if the lane output is 'true' but the job reports
  # 'skipped' (a broken gate expression, an undeclared output, a workflow
  # parse failure), that is a fail, not a pass. See
  # tests/ci/test_classify_changes.py for the lane/output wiring invariants.
  #
  # Branch protection should require ONLY this check.
  #
  # The check name carries a version. The ruleset requires a check NAME, and a
  # green check run recorded on a PR head stays valid forever, so a PR whose
  # last CI predates a new required job still merges on that old green (32
  # PRs merged without the code-health ratchet that way). When the required
  # set gains a job every open PR must pass, bump the version here and in the
  # protect-main ruleset in the same rollout: older greens then no longer
  # count, and each PR needs one fresh CI run before it can merge.
  #
  # Outputs ``needs-json`` — a compact ``{job_name: result}`` dict — so
  # the live comment poller can list failed jobs in the PR comment.
  # ─────────────────────────────────────────────────────────────────────
  all-checks-pass:
    name: All required checks pass (v2)
    needs:
      - detect
      - tests
      - tests-os
      - lint
      - js-tests
      - rust-tests
      - remote-backends
      - catalog-tests
      - bootstrap-installer
      - e2e-desktop
      - e2e-desktop-core
      - e2e-desktop-update
      - docs-site
      - repo-guards
      # OSV runs weekly against main (osv-scanner.yml schedule), not per PR:
      # every PR was reporting the same repo-wide baseline of pinned-dep CVEs
      # in its review comment, and the SARIF upload tripped GitHub's
      # per-installation API rate limit during merge trains.
      # The image build runs in its own workflow (docker.yml) and reports
      # its own check. It was never required here, because it is too slow
      # to block a merge. A separate run also stops it from holding this
      # run open. That is what blocked ``gh run rerun``.
    # dlz: skipped (not a vacuous green) on drafts; ready_for_review re-runs it.
    if: always() && github.event.pull_request.draft != true
    # actions: read is for the timing report steps below (completed jobs' cache transfer logs).
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      needs-json: ${{ steps.evaluate.outputs.needs-json }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
      - name: Evaluate job results
        id: evaluate
        # Shared with the stable orchestrator (scripts/ci/required_results.py
        # is imported there). NEEDS is the toJSON(needs) context; RELEASE
        # switches the gate into strict mode for release runs.
        env:
          NEEDS: ${{ toJSON(needs) }}
          RELEASE: ${{ inputs.release }}
        run: |
          echo "$NEEDS" | python3 -c "
          import json, os, sys
          from scripts.ci.required_results import evaluate_gate
          needs = json.load(sys.stdin)
          # Emit compact {job_name: result} for the comment assembler.
          compact = {name: info['result'] for name, info in needs.items()}
          print(f'needs-json={json.dumps(compact)}')
          with open('$GITHUB_OUTPUT', 'a') as f:
              f.write(f'needs-json={json.dumps(compact)}\n')
          detect = needs.get('detect', {})
          detect_out = detect.get('outputs', {}) or {}
          failed = [name for name, info in needs.items() if info['result'] in ('failure', 'cancelled')]
          for name, info in sorted(needs.items()):
              result = info['result']
              icon = '✅' if result in ('success', 'skipped') else '❌'
              print(f'{icon} {name}: {result}')

          # Lane ⇒ job consistency. When the classifier armed a lane, the
          # corresponding sub-workflow must have produced a real verdict —
          # 'skipped' here means the gate expression or output wiring is
          # broken, and treating it as neutral would be green-by-subtraction.
          # The guard lanes (contributors, uv.lock, docker lint, history,
          # lockfile diff, supply chain) are steps of repo-guards since
          # v0.23.1; a failed step fails that job. The e2e-desktop job is
          # deliberately disabled and osv has its own trigger, so neither
          # appears here.
          selected = lambda lane: detect_out.get(lane) == 'true'
          # repo-guards runs on every event once detect ran (each guard is a
          # lane-gated step inside it), so it must always report success.
          lane_jobs = ['repo-guards']
          if selected('python'):
              lane_jobs += ['lint']
          if selected('python') or selected('e2e') or selected('e2e_upgrade'):
              lane_jobs += ['tests']
          if selected('os_tests') and any(selected(lane) for lane in ('python', 'desktop_updater', 'e2e', 'e2e_upgrade')):
              lane_jobs += ['tests-os']
          if selected('desktop_e2e') and selected('e2e_desktop_core'):
              lane_jobs += ['e2e-desktop-core']
          if selected('frontend'):
              lane_jobs += ['js-tests']
          if selected('site'):
              lane_jobs += ['docs-site']
          if selected('bootstrap'):
              lane_jobs += ['bootstrap-installer']
          if selected('rust'):
              lane_jobs += ['rust-tests']
          for job in lane_jobs:
              result = needs.get(job, {}).get('result')
              if result != 'success':
                  print(f'::error::lane-selected job {job!r} reported {result!r} '
                        f'instead of success — refusing green-by-subtraction')
                  if job not in failed:
                      failed.append(job)

          if os.environ.get('RELEASE', '').lower() == 'true':
              for job in evaluate_gate(needs, release=True)['failed']:
                  if job not in failed:
                      failed.append(job)

          if failed:
              print(f'::error::{len(failed)} job(s) failed: {\", \".join(failed)}')
              sys.exit(1)
          print('All checks passed (or were intentionally skipped by the classifier)')
          "

      # ───────────────────────────────────────────────────────────────────
      # CI timing report: collect per-job/step durations from the GitHub API,
      # cache them on main (as a baseline), and on PRs generate an HTML diff
      # report with a gantt chart + per-step breakdown. The report is uploaded
      # as an artifact and a markdown summary is written to $GITHUB_STEP_SUMMARY.
      #
      # These steps used to be a separate `ci-timings` job that started right
      # after this one, on the same runner, with its own checkout: a second
      # billed minute for ~15s of work. They are advisory: every one runs
      # whatever the verdict above was (`always()`), never fails the gate
      # (`continue-on-error`), and is time-boxed so a slow GitHub API cannot
      # hold the required check open.
      #
      # The live comment poller dynamically fetches all review-status-* artifacts
      # across the orchestrator and sub-workflow runs every cycle, so its link
      # points straight at that report.
      #
      # dlz: the fork never ran the timing report (the old ci-timings job was
      # NousResearch-only), so every timing step below keeps that guard.
      # ───────────────────────────────────────────────────────────────────
      - name: Restore timing baseline cache (PR only)
        if: always() && github.repository == 'NousResearch/hermes-agent' && github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ci-timings-baseline.json
          # Prefix-match: exact key will never hit (run_id differs), so
          # restore-keys finds the most recent baseline from main.
          key: ci-timings-baseline-never-exact
          restore-keys: |
            ci-timings-baseline-

      - name: Collect timings and generate report
        if: always() && github.repository == 'NousResearch/hermes-agent'
        continue-on-error: true
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci/timings_report.py \
            --own-job-last-step "Evaluate job results" \
            --baseline ci-timings-baseline.json \
            --output ci-timings-report.html \
            --json-out ci-timings.json \
            --summary-out ci-timings-summary.md

      - name: Upload HTML timing report
        if: always() && github.repository == 'NousResearch/hermes-agent' && hashFiles('ci-timings-report.html') != ''
        # Advisory report — artifact-service blips must not fail the job.
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: ci-timings-html
        with:
          path: ci-timings-report.html
          archive: false
          retention-days: 14

      - name: Build linked review status
        if: always() && github.repository == 'NousResearch/hermes-agent' && hashFiles('ci-timings.json') != ''
        continue-on-error: true
        timeout-minutes: 2
        env:
          CI_TIMINGS_REPORT_URL: ${{ steps.ci-timings-html.outputs.artifact-url }}
        run: |
          python3 scripts/ci/timings_report.py \
            --from-json ci-timings.json \
            --baseline ci-timings-baseline.json \
            --review-status-out review-status.json \
            --review-status-only

      - name: Upload review status
        if: always() && github.repository == 'NousResearch/hermes-agent' && hashFiles('review-status.json') != ''
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-status-ci-timings
          path: review-status.json
          retention-days: 14

      - name: Output timing summary
        if: always() && github.repository == 'NousResearch/hermes-agent' && hashFiles('ci-timings-summary.md') != ''
        continue-on-error: true
        env:
          REPORT_URL: ${{ steps.ci-timings-html.outputs.artifact-url}}
        run: |
          {
            echo "# CI Timing report"
            echo "[View the full interactive report]($REPORT_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
          cat ci-timings-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save timing baseline (main only)
        if: always() && github.repository == 'NousResearch/hermes-agent' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          # Degraded runs (API rate-limited) produce no ci-timings.json —
          # skip rather than fail, and never cache an empty baseline.
          if [ -f ci-timings.json ]; then
            cp ci-timings.json ci-timings-baseline.json
          else
            echo "No timings JSON this run — skipping baseline update"
          fi

      - name: Upload timing baseline to cache (main only)
        if: always() && github.repository == 'NousResearch/hermes-agent' && github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('ci-timings-baseline.json') != ''
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ci-timings-baseline.json
          key: ci-timings-baseline-${{ github.run_id }}
