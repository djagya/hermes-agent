# Review-only pin drift check. Never publishes, never merges.
name: Pin refresh reminder

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  remind:
    if: github.repository == 'djagya/hermes-agent'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Open review issue with current pins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          {
            echo "Weekly pin review. No unattended merge."
            echo
            echo '```'
            grep -E '^(FROM |ARG |    ")' Dockerfile | head -80
            echo '```'
          } > "$body"
          gh issue create --title "pin-refresh $(date -u +%F)" --body-file "$body" \
            || echo "issue create failed (permissions?); pins printed above"
          cat "$body"
