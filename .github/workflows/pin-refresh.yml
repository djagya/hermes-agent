# Review-only pin drift PR. Never publishes, never merges.
name: Pin refresh reminder

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  remind:
    if: github.repository == 'djagya/hermes-agent'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true

      - name: Open review-only draft PR with current pins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%F)"
          branch="pin-refresh/${stamp}"
          report="docker/sera-toolbox/pin-refresh-report.md"
          {
            echo "# Pin refresh ${stamp}"
            echo
            echo "Review-only. No unattended merge, publish, or deploy."
            echo "Fill old vs new versions, release links, SBOM/CVE"
            echo "delta, and image-size delta before bumping."
            echo
            echo "## Accepted budget"
            echo
            echo '```json'
            cat docker/sera-toolbox/image-budget.json
            echo '```'
            echo
            echo "## Dockerfile pins"
            echo
            echo '```'
            grep -E '^(FROM |ARG )' Dockerfile | head -80
            echo '```'
          } > "$report"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add "$report"
          if git diff --cached --quiet; then
            echo "report unchanged"
            exit 0
          fi
          git commit -m "chore(image): pin-refresh report ${stamp}"
          git push -u origin "$branch"
          gh pr create --draft --title "pin-refresh ${stamp}" \
            --body-file "$report" \
            || echo "pr create failed (already open?); report printed above"
          cat "$report"
